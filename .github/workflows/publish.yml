name: Publish due Instagram posts

on:
  schedule:
    # Every 10 minutes. Hourly reads as "at worst an hour late" but is not:
    # GitHub delays or drops schedule events under load, and on 20.9.2026 the
    # stocklearneasy 12:00 post sat in the queue for two hours because no run
    # fired between 11:09 and 14:08. This repo is public, so Actions minutes
    # are unlimited and running this often costs nothing. The Mac also kicks
    # the workflow after each slot (~/.local/bin/publish-kick-ai-he.sh).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: pip install --quiet pillow

      # The secret names are deliberately the same as the stock pipeline's,
      # which is safe because publish.py refuses to post unless the token
      # belongs to this repo's own account. They were AI_IG_* here until
      # 3.10.2026, when the account was connected and the secrets were stored
      # under the unprefixed names: the run then found an empty token, printed
      # "nothing to do" and exited 0, so the pipeline looked healthy while
      # being incapable of publishing anything.
      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publish.py

      - name: Commit moved files
        run: |
          git config user.name "ai-hebrew-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "publish run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
